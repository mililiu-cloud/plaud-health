<script>
const P = JSON.parse(document.getElementById("payload").textContent);
const b642buf = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  const pw = document.getElementById("pw").value;
  if (!pw) return;
  btn.disabled = true; btn.textContent = "解密中…"; err.textContent = "";
  try {
    if (!crypto.subtle) throw new Error("insecure-context");
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b642buf(P.salt), iterations: P.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b642buf(P.iv) }, key, b642buf(P.ct));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch (ex) {
    btn.disabled = false; btn.textContent = "进入";
    err.textContent = ex.message === "insecure-context"
      ? "浏览器未提供加密接口，请通过 https:// 访问。"
      : "口令不正确。";
    document.getElementById("pw").select();
  }
});
</script>
