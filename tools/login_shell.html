<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Plaud 公司健康度看板</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #f9f9f7; color: #0b0b0b;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.55; padding: 24px;
  }
  @media (prefers-color-scheme: dark) { body { background: #0d0d0d; color: #fff; } }
  .card {
    width: 100%; max-width: 380px; background: #fcfcfb;
    border: 1px solid rgba(11,11,11,.10); border-radius: 14px; padding: 26px 24px 22px;
  }
  @media (prefers-color-scheme: dark) {
    .card { background: #1a1a19; border-color: rgba(255,255,255,.10); }
  }
  h1 { font-size: 17px; font-weight: 620; margin: 0 0 6px; letter-spacing: -.01em; }
  p.hint { font-size: 12.5px; color: #898781; margin: 0 0 18px; }
  label { display: block; font-size: 12.5px; color: #52514e; margin-bottom: 6px; }
  @media (prefers-color-scheme: dark) { label { color: #c3c2b7; } }
  input {
    width: 100%; font: inherit; padding: 9px 11px; border-radius: 8px;
    border: 1px solid rgba(11,11,11,.18); background: transparent; color: inherit;
  }
  @media (prefers-color-scheme: dark) { input { border-color: rgba(255,255,255,.20); } }
  input:focus { outline: 2px solid #2a78d6; outline-offset: 1px; border-color: transparent; }
  button {
    width: 100%; font: inherit; font-weight: 600; margin-top: 12px;
    padding: 9px 12px; border-radius: 8px; border: 0; cursor: pointer;
    background: #2a78d6; color: #fff;
  }
  button:disabled { opacity: .6; cursor: progress; }
  .err { font-size: 12.5px; color: #d03b3b; margin-top: 10px; min-height: 18px; }
  .foot { font-size: 11.5px; color: #898781; margin-top: 16px; border-top: 1px solid rgba(11,11,11,.10); padding-top: 12px; }
  @media (prefers-color-scheme: dark) { .foot { border-color: rgba(255,255,255,.10); } }
</style>
</head>
<body>
<main class="card">
  <h1>Plaud 公司健康度看板</h1>
  <p class="hint">内部看板，需口令访问。</p>
  <form id="f" autocomplete="off">
    <label for="pw">访问口令</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <button id="go" type="submit">进入</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <div class="foot">页面内容以 AES-256-GCM 加密存储，口令经 PBKDF2-SHA256 派生密钥。口令错误时无法解密，源码中不含明文数据。</div>
</main>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
const P = JSON.parse(document.getElementById("payload").textContent);
const b642buf = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  const pw = document.getElementById("pw").value;
  if (!pw) return;
  btn.disabled = true; btn.textContent = "解密中…"; err.textContent = "";
  try {
    if (!crypto.subtle) throw new Error("insecure-context");
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b642buf(P.salt), iterations: P.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b642buf(P.iv) }, key, b642buf(P.ct));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch (ex) {
    btn.disabled = false; btn.textContent = "进入";
    err.textContent = ex.message === "insecure-context"
      ? "浏览器未提供加密接口，请通过 https:// 访问。"
      : "口令不正确。";
    document.getElementById("pw").select();
  }
});
</script>
</body>
</html>
